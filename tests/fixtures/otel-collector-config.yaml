# OTel Collector configuration for integration tests.
#
# Beatrice exports OTLP/HTTP to us on 4318, we write every span as a JSON line to /export/spans.jsonl. Tests assert on emitted gen_ai.* attributes.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Small batch so tests don't wait for a large buffer to flush.
  batch:
    timeout: 200ms
    send_batch_size: 1

exporters:
  file:
    path: /export/spans.jsonl
    rotation:
      max_megabytes: 10
      max_backups: 1

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [file]

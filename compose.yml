services:
  beatrice:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # Override values in .env that only make sense inside the compose network.
      LLM__BASE_URL: http://ollama:11434/v1
      OTEL__EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      RABBITMQ__CONNECTION_STRING: amqp://guest:guest@rabbitmq:5672/
      GENERATE_AUDIO__CALLBACK__ALLOWED_HOSTS: presign-server,localhost
      TTS__QWEN__BASE_URL: http://qwen-tts:8001
      # Matches the qwen-tts shim's `_VOICES` mapping (local-setup/qwen-tts/server.py) —
      # voices are static config now, not fetched from a voices-listing endpoint.
      TTS__QWEN__VOICES: default
      # CustomVoice CPU inference is slow enough locally to exceed the 30s client default —
      # 120s still wasn't enough for a few hundred characters of text, so this is generous.
      TTS__QWEN__TIMEOUT_MS: "300000"
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      ollama:
        condition: service_healthy
      otel-healthcheck:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      qwen-tts:
        condition: service_healthy
      presign-server:
        condition: service_healthy

  ollama:
    build:
      context: local-setup/ollama
      dockerfile: Dockerfile
      args:
        OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    ports:
      - 11434:11434
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

  qwen-tts:
    build:
      context: local-setup/qwen-tts
      dockerfile: Dockerfile
      args:
        QWEN_TTS_MODEL: ${QWEN_TTS_MODEL:-Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice}
    ports:
      - 8001:8001
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_HOST_PORT:-9010}:9000" # host side only; kept off 9000, a common local-tooling default (e.g. Jupyter)
      - 9001:9001 # console UI
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  minio-init:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/${MINIO_BUCKET:-beatrice-local}

  presign-server:
    build:
      context: local-setup/presign-server
      dockerfile: Dockerfile
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: ${MINIO_BUCKET:-beatrice-local}
    ports:
      - 8002:8002
    depends_on:
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - 5672:5672
      - 15672:15672 # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.155.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./local-setup/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - 4318:4318 # OTLP HTTP -- apps point OTEL__EXPORTER_OTLP_ENDPOINT to this port
      - 4317:4317 # OTLP gRPC -- Apps push traces via gRPC to this port

  otel-healthcheck:
    image: busybox:1.37
    depends_on:
      otel-collector:
        condition: service_started
    command:
      - sh
      - -eu
      - -c
      - |
        for i in $$(seq 1 60); do
          if wget -S -qO- --timeout=3 http://otel-collector:13133/ 2>&1; then
            echo "otel-collector is healthy after $$i attempt(s)"
            exit 0
          fi
          echo "[$$i/60] otel-collector not ready yet, retrying in 2s..."
          sleep 2
        done
        echo "ERROR: otel-collector did not become healthy within 120s" >&2
        exit 1

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - 16686:16686 # UI
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:14269"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

services:
  beatrice:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # Override values in .env that only make sense inside the compose network.
      LLM__BASE_URL: http://ollama:11434/v1
      OTEL__EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      RABBITMQ__CONNECTION_STRING: amqp://guest:guest@rabbitmq:5672/
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      ollama:
        condition: service_healthy
      otel-healthcheck:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "src.worker"]
    env_file:
      - .env
    environment:
      OTEL__EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      RABBITMQ__CONNECTION_STRING: amqp://guest:guest@rabbitmq:5672/
    # The image's HEALTHCHECK curls the GraphQL server on :3000, which this service
    # never runs — the worker has no HTTP surface, so that check is meaningless here.
    healthcheck:
      disable: true
    depends_on:
      otel-healthcheck:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  ollama:
    build:
      context: local-setup/ollama
      dockerfile: Dockerfile
      args:
        OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    ports:
      - 11434:11434
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - 5672:5672
      - 15672:15672 # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.155.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./local-setup/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - 4318:4318 # OTLP HTTP -- apps point OTEL__EXPORTER_OTLP_ENDPOINT to this port
      - 4317:4317 # OTLP gRPC -- Apps push traces via gRPC to this port

  otel-healthcheck:
    image: busybox:1.37
    depends_on:
      otel-collector:
        condition: service_started
    command:
      - sh
      - -eu
      - -c
      - |
        for i in $$(seq 1 60); do
          if wget -S -qO- --timeout=3 http://otel-collector:13133/ 2>&1; then
            echo "otel-collector is healthy after $$i attempt(s)"
            exit 0
          fi
          echo "[$$i/60] otel-collector not ready yet, retrying in 2s..."
          sleep 2
        done
        echo "ERROR: otel-collector did not become healthy within 120s" >&2
        exit 1

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - 16686:16686 # UI
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:14269"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

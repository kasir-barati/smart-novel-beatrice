name: Release Docker image

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  check_release:
    name: Check if a release is needed
    runs-on: ubuntu-latest
    outputs:
      will_release: ${{ steps.decide.outputs.will_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install release deps
        run: npm ci

      - name: Decide via semantic-release --dry-run
        id: decide
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # Dry-run prints "The next release version is X.Y.Z" when a release would happen, and "There are no relevant changes, so no new version is released" otherwise. We capture stdout+stderr and grep for the decision line.
          output="$(npm run --silent release -- --dry-run 2>&1)" || {
            echo "$output"
            echo "semantic-release --dry-run failed."
            exit 1
          }
          echo "$output"
          if echo "$output" | grep -q "The next release version is"; then
            echo "will_release=true" >> "$GITHUB_OUTPUT"
            echo "==> A release will be cut."
          else
            echo "will_release=false" >> "$GITHUB_OUTPUT"
            echo "==> No release needed."
          fi

  unit_tests:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Python deps
        run: uv sync

      # Cheap and diff-based (no Docker), so it runs unconditionally on every push unlike integration_tests below, this isn't worth gating behind will_release.
      - name: Check wire-contract test coverage
        env:
          DIFF_BASE_SHA: ${{ github.event.before }}
        run: uv run python local-setup/scripts/check_wire_contract_test_coverage.py "$DIFF_BASE_SHA"

      - name: Run unit tests
        run: make test

  evals:
    name: Run evals
    needs: check_release
    if: ${{ needs.check_release.outputs.will_release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Python deps
        run: uv sync

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # `local-setup/ollama/Dockerfile` bakes the model in at build time, so caching the built image = caching the model weights (~2 GB for qwen2.5:3b). We build once, load into the local daemon, and tag it with the exact name `docker compose up ollama` expects (<project>-<service>) so compose reuses it instead of rebuilding.
      - name: Build Ollama image (cached)
        uses: docker/build-push-action@v6
        with:
          context: local-setup/ollama
          load: true
          tags: smart-novel-beatrice-ollama:latest
          cache-from: type=gha,scope=ollama-evals
          cache-to: type=gha,scope=ollama-evals,mode=max
          # Keep in sync with .env.example / compose.yml default. Bumping this invalidates the cache on purpose (different model = different image).
          build-args: |
            OLLAMA_MODEL=qwen2.5:3b

      - name: Run evals
        id: run_evals
        env:
          # Force compose's generated image name to match the tag we just loaded above, so `docker compose up ollama` skips rebuilding.
          COMPOSE_PROJECT_NAME: smart-novel-beatrice
        run: make evals

      # Dump each module's report.json so we can compare CI booleans against the report.json committed from a local run. Runs only on failure to keep green pipelines quiet.
      - name: Dump eval reports on failure
        if: failure() && steps.run_evals.conclusion == 'failure'
        run: |
          shopt -s nullglob
          for f in src/modules/*/evals/report.json; do
            echo "== $f =="
            cat "$f"
            echo
          done

  integration_tests:
    name: Run integration tests
    needs: check_release
    # Gated behind will_release on purpose. This job builds/boots Ollama + the full app image via Testcontainers, which is expensive, and a docs-only push shouldn't pay that cost. The tradeoff we accepted: a commit message which is not releasing a new version (look at .releaserc.json for more info) might break tests and they won't be caught here until some later commit does trigger a release — and even then, a push can bundle several commits, so a red run only gives "somewhere in this push", not a single commit to blame. We considered narrowing the gate to skip only genuinely docs-only pushes (by diffed file paths) and run it for chore/refactor too, but decided the added complexity wasn't worth it right now — check_wire_contract_test_coverage.py (in unit_tests above, which always runs) is the actual backstop against this class of miss; re-open this if that proves insufficient in practice.
    if: ${{ needs.check_release.outputs.will_release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Python deps
        run: uv sync

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Pre-build the Ollama image with GHA layer caching so tests/conftest.py finds `smart-novel-beatrice-ollama:latest` already loaded and skips building it (~2 GB model bake). The tag matches the constant `OLLAMA_IMAGE` in tests/conftest.py.
      - name: Build Ollama image (cached)
        uses: docker/build-push-action@v6
        with:
          context: local-setup/ollama
          load: true
          tags: smart-novel-beatrice-ollama:latest
          cache-from: type=gha,scope=ollama-evals
          cache-to: type=gha,scope=ollama-evals,mode=max
          build-args: |
            OLLAMA_MODEL=qwen2.5:3b

      - name: Run integration tests
        run: make integration_test

  release:
    name: Release + publish Docker image
    needs: [unit_tests, evals, integration_tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install release deps
        run: npm ci

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          # TODO: replace with the smart-novel-beatrice Docker Hub account
          username: 9109679196
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Release and publish Docker image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # TODO: replace with the smart-novel-beatrice Docker Hub repo
          DOCKERHUB_REPOSITORY: 9109679196/smart-novel-beatrice
        run: npm run release
